name: laravel
version: "11"
label: Laravel
color: "#ff2d20"
public_dir: public
create: composer create-project --no-install --no-plugins --no-scripts laravel/laravel

php:
  min: "8.2"
  max: "8.4"

detect:
  - file: artisan
  - composer: laravel/framework

env:
  file: .env
  example_file: .env.example
  format: dotenv
  key_generation:
    env_key: APP_KEY
    command: key:generate
    fallback_prefix: "base64:"
  sqlite:
    detect:
      - key: DB_CONNECTION
        value_prefix: sqlite
    vars:
      - DB_CONNECTION=sqlite
      - DB_DATABASE=database/database.sqlite
  services:
    mysql:
      detect:
        - key: DB_CONNECTION
          value_prefix: mysql
        - key: DB_CONNECTION
          value_prefix: mariadb
      vars:
        - DB_CONNECTION=mysql
        - DB_HOST=lerd-mysql
        - DB_PORT=3306
        - DB_DATABASE={{site}}
        - DB_USERNAME=root
        - DB_PASSWORD=lerd
    postgres:
      detect:
        - key: DB_CONNECTION
          value_prefix: pgsql
      vars:
        - DB_CONNECTION=pgsql
        - DB_HOST=lerd-postgres
        - DB_PORT=5432
        - DB_DATABASE={{site}}
        - DB_USERNAME=postgres
        - DB_PASSWORD=lerd
    redis:
      detect:
        - key: REDIS_HOST
        - key: CACHE_STORE
          value_prefix: redis
        - key: SESSION_DRIVER
          value_prefix: redis
        - key: QUEUE_CONNECTION
          value_prefix: redis
      vars:
        - REDIS_HOST=lerd-redis
        - REDIS_PORT=6379
        - REDIS_PASSWORD=
    meilisearch:
      detect:
        - key: SCOUT_DRIVER
          value_prefix: meilisearch
      vars:
        - MEILISEARCH_HOST=http://lerd-meilisearch:7700
        - MEILISEARCH_NO_ANALYTICS=true
    rustfs:
      detect:
        - key: FILESYSTEM_DISK
          value_prefix: s3
        - key: AWS_ENDPOINT
      vars:
        - AWS_ACCESS_KEY_ID=lerd
        - AWS_SECRET_ACCESS_KEY=lerdpassword
        - AWS_BUCKET={{site}}
        - AWS_ENDPOINT=http://lerd-rustfs:9000
        - AWS_URL=http://localhost:9000/{{site}}
        - AWS_USE_PATH_STYLE_ENDPOINT=true
    mailpit:
      detect:
        - key: MAIL_HOST
      vars:
        - MAIL_MAILER=smtp
        - MAIL_HOST=lerd-mailpit
        - MAIL_PORT=1025
        - MAIL_USERNAME=null
        - MAIL_PASSWORD=null
        - MAIL_ENCRYPTION=null

composer: auto
npm: auto
console: artisan
# Run after a connection change: the compiled container is built
# against the old database and answers every request with an error.
cache_command: optimize:clear

workers:
  queue:
    label: Queue Worker
    icon: queue
    command: php artisan queue:work --queue=default --tries=3 --timeout=60
    tune_command: php artisan queue:work --queue={queue} --tries={tries} --timeout={timeout}
    restart_command: php artisan queue:restart
    # The worker dies on a DNS error when the queue is Redis and lerd-redis is
    # down, so lerd refuses the start with the service to run instead.
    requires_service:
      name: redis
      when_env: QUEUE_CONNECTION=redis
    restart: always
    exclude_check:
      composer: laravel/horizon
  schedule:
    label: Task Scheduler
    icon: clock
    command: php artisan schedule:work
    restart: always
  reverb:
    label: Reverb WebSocket
    icon: broadcast
    command: php artisan reverb:start
    restart: on-failure
    check:
      composer: laravel/reverb
    proxy:
      # path stays for binaries older than multi-path support; paths wins where
      # both are read. Reverb serves the WebSocket on /app and the HTTP
      # broadcasting API on /apps, on the same port.
      path: /app
      paths:
        - /app
        - /apps
      port_env_key: REVERB_SERVER_PORT
      default_port: 8080
  horizon:
    label: Horizon
    icon: horizon
    color: "#405263"
    command: php artisan horizon
    reload_command: php artisan horizon:listen
    restart: always
    check:
      composer: laravel/horizon
    conflicts_with:
      - queue
  vite:
    icon: vite
    color: "#9135ff"
    per_worktree: true
    replaces_build: true
    label: Vite
    command: npm run dev
    restart: on-failure
    host: true
    check:
      file: node_modules/vite
    health:
      url_file: public/hot

  native:
    label: NativePHP
    icon: nativephp
    color: "#4f46e5"
    command: vendor/nativephp/electron/resources/js/resources/php/php artisan native:serve --no-dependencies --no-interaction
    restart: on-failure
    host: true
    # The runtime rather than the package: before native:install the binary this
    # command names is not there, and a worker offered then can only fail.
    check:
      file: vendor/nativephp/electron/resources/js/resources/php/php

logs:
  - path: storage/logs/*.log
    format: monolog

setup:
  - label: php artisan storage:link
    command: php artisan storage:link
    default: true
  - label: php artisan migrate
    command: php artisan migrate
    default: true
  - label: php artisan db:seed
    command: php artisan db:seed
    default: false
tinker:
  command: ["artisan", "tinker"]
  execute_flag: "--execute"
  requires_package: laravel/tinker
  requires_file: artisan

commands:
  - name: optimize:clear
    label: Clear all caches
    command: php artisan optimize:clear
    description: Clear config, route, view, event, and compiled caches
    output: silent
    icon: broom
  - name: migrate
    label: Run migrations
    command: php artisan migrate --force
    description: Apply pending database migrations
    output: silent
    icon: database
  - name: migrate:fresh
    label: Drop and re-migrate
    command: php artisan migrate:fresh --seed --force
    description: Wipe the database, re-run all migrations, then seed
    output: silent
    confirm: true
    icon: refresh
  - name: key:generate
    label: Generate APP_KEY
    command: php artisan key:generate
    description: Set the application encryption key in .env
    output: silent
    icon: key
  - name: storage:link
    label: Link storage
    command: php artisan storage:link
    description: Create the public/storage symlink to storage/app/public
    output: silent
    icon: link

  - name: native:install
    label: Install NativePHP runtime
    command: >-
      npm --prefix vendor/nativephp/electron/resources/js install &&
      NATIVEPHP_PHP_BINARY_PATH="$PWD/vendor/nativephp/php-bin/bin/"
      NATIVEPHP_PHP_BINARY_VERSION="$(php -r 'echo PHP_MAJOR_VERSION.".".PHP_MINOR_VERSION;')"
      node vendor/nativephp/electron/resources/js/php.js &&
      vendor/nativephp/electron/resources/js/resources/php/php artisan native:install --force --no-interaction
    description: Install Electron and the matching desktop PHP binary, then publish the NativePHP scaffolding
    output: text
    icon: arrow-down
    check:
      composer: nativephp/electron
  - name: native:build
    label: Build desktop app
    command: vendor/nativephp/electron/resources/js/resources/php/php artisan native:build
    description: Package the app as a desktop binary for the chosen platform
    output: terminal
    icon: play
    check:
      file: vendor/nativephp/electron/resources/js/resources/php/php
  - name: native:install
    label: Install NativePHP runtime
    command: |
      set -e
      composer require --dev nativephp/php-bin --no-interaction
      version="$(php -r 'echo PHP_MAJOR_VERSION.".".PHP_MINOR_VERSION;')"
      os=mac; arch=arm64
      case "$(uname -s)" in Linux) os=linux; arch=x64 ;; esac
      case "$(uname -m)" in x86_64|amd64) arch=x64 ;; esac
      dir=vendor/nativephp/php-bin/bin/host
      mkdir -p "$dir"
      unzip -o -j "vendor/nativephp/php-bin/bin/$os/$arch/php-$version.zip" -d "$dir"
      chmod +x "$dir/php"
      "$dir/php" artisan native:install
    description: Add the desktop PHP binary this machine needs to drive the mobile toolchain, then install the NativePHP platform resources
    output: terminal
    icon: arrow-down
    confirm: true
    check:
      composer: nativephp/mobile
  - name: native:jump
    label: Jump (test on a device)
    command: vendor/nativephp/php-bin/bin/host/php artisan native:jump
    description: Serve the app to a phone on your network and draw the QR code to scan
    output: terminal
    icon: play
    check:
      file: vendor/nativephp/php-bin/bin/host/php
  - name: native:run
    label: Run on device
    command: vendor/nativephp/php-bin/bin/host/php artisan native:run
    description: Build the app and launch it on a simulator, emulator or connected device
    output: terminal
    icon: play
    pinned: true
    check:
      file: vendor/nativephp/php-bin/bin/host/php
  - name: native:open
    label: Open native project
    command: vendor/nativephp/php-bin/bin/host/php artisan native:open
    description: Open the generated Xcode or Android Studio project
    output: terminal
    icon: edit
    check:
      file: vendor/nativephp/php-bin/bin/host/php

doctor:
  migrate_command: migrate
  checks:
    - name: app_debug
      type: env_combo
      when:
        APP_ENV: production
      warn_if:
        APP_DEBUG: "true"
      detail: "APP_DEBUG is on while APP_ENV=production, so stack traces and config will leak. Turn debug off."
    - name: storage_link
      type: symlink
      link: public/storage
      target: storage/app/public
      requires_dir: public
      fix: storage:link
      detail: "public/storage symlink is missing, so files on the public disk won't be web-accessible."
    - name: migrations
      type: command
      command: php artisan migrate:status
      fail_if_output_contains: Pending
      fail_if_error_contains: Migration table not found
      unknown_on_error: true
      fix: migrate
      detail: "There are pending migrations, run migrate to apply them."
    - name: nativephp_runtime
      type: command
      command: test ! -d vendor/nativephp/electron || { test -x vendor/nativephp/electron/resources/js/resources/php/php && test -d vendor/nativephp/electron/resources/js/node_modules/electron; }
      severity: warn
      check:
        composer: nativephp/electron
      fix: native:install
      detail: "NativePHP is installed but its desktop runtime is missing on this machine, so native:serve cannot start. Install the NativePHP runtime."
    - name: nativephp_mobile_runtime
      type: command
      command: test ! -d vendor/nativephp/mobile || test -x vendor/nativephp/php-bin/bin/host/php
      severity: warn
      check:
        composer: nativephp/mobile
      fix: native:install
      detail: "NativePHP for Mobile is installed but the host PHP it drives the toolchain with is missing, so native:run and native:jump cannot start. Install the NativePHP runtime."
    - name: nativephp_mobile_toolchain
      type: command
      command: 'test ! -d vendor/nativephp/mobile || { test "$(uname -s)" = Darwin && xcrun --find xcodebuild >/dev/null 2>&1; } || test -d "${ANDROID_HOME:-$HOME/Library/Android/sdk}" || test -d "$HOME/Android/Sdk"'
      severity: warn
      check:
        composer: nativephp/mobile
      detail: "No mobile toolchain found. iOS builds need Xcode, Android builds need the Android SDK."
    - name: nativephp_android_jdk
      type: command
      command: |
        test -d vendor/nativephp/mobile || exit 0
        test -d "${ANDROID_HOME:-$HOME/Library/Android/sdk}" || test -d "$HOME/Android/Sdk" || exit 0
        java="${JAVA_HOME:+$JAVA_HOME/bin/}java"
        command -v "$java" >/dev/null 2>&1 || exit 1
        major=$("$java" -version 2>&1 | head -1 | sed -n 's/.*version "\([0-9][0-9]*\).*/\1/p')
        test "${major:-0}" -ge 17
      severity: warn
      check:
        composer: nativephp/mobile
      detail: "The Android SDK is here but the JDK Gradle would use is older than 17, so native:run android fails. Point JAVA_HOME at a newer JDK, for example the one Android Studio bundles."
