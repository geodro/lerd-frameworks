package: nativephp/desktop
frameworks:
  - name: laravel
    min: "11"

workers:
  native:
    label: NativePHP
    icon: nativephp
    color: "#4f46e5"
    command: vendor/nativephp/desktop/resources/build/php/php artisan native:run --no-interaction
    restart: on-failure
    host: true
    # Named by path, never a bare `php`: on the host that is lerd's shim back
    # into the container, where there is no Electron and no display.
    check:
      file: vendor/nativephp/desktop/resources/build/php/php

# These reach for Electron and a display, which the container has neither of.
# The whole namespace, so a command upstream adds later needs no edit here.
host_commands:
  - args: "artisan native:*"
    binary: vendor/nativephp/desktop/resources/build/php/php
    install_command: native:install

commands:
  - name: native:install
    label: Install NativePHP runtime
    command: >-
      npm --prefix vendor/nativephp/desktop/resources/electron install &&
      NATIVEPHP_PHP_BINARY_PATH="$PWD/vendor/nativephp/php-bin/bin/"
      NATIVEPHP_PHP_BINARY_VERSION="$(php -r 'echo PHP_MAJOR_VERSION.".".PHP_MINOR_VERSION;')"
      NATIVEPHP_BUILD_PATH="$PWD/vendor/nativephp/desktop/resources/build"
      node vendor/nativephp/desktop/resources/electron/php.js &&
      php artisan native:install --no-interaction
    description: Install the Electron dependencies and the matching desktop PHP binary, then publish the NativePHP scaffolding
    output: text
    icon: arrow-down
  - name: native:publish
    label: Publish the Electron project
    command: php artisan native:install --publish --no-interaction
    description: Export the Electron project to nativephp/electron in the project root for full control over the runtime
    output: text
    icon: folder
  - name: native:build
    label: Build desktop app
    command: vendor/nativephp/desktop/resources/build/php/php artisan native:build
    description: Package the app as a desktop binary for the chosen platform
    output: terminal
    icon: play
    check:
      file: vendor/nativephp/desktop/resources/build/php/php

doctor:
  checks:
    - name: nativephp_runtime
      type: command
      command: test ! -d vendor/nativephp/desktop || { test -x vendor/nativephp/desktop/resources/build/php/php && test -d vendor/nativephp/desktop/resources/electron/node_modules/electron; }
      severity: warn
      fix: native:install
      detail: "NativePHP is installed but its desktop runtime is missing on this machine, so native:run cannot start. Install the NativePHP runtime."
